<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shopify-buy what you like</title>
    <style>
      /* Reset default styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Body styling */
body {
  font-family: Arial, sans-serif;
  background-color: #f2f2f2;
  color: #333;
  padding: 20px;
}

/* Navigation links */
main > div:first-child {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 30px;
}

main a {
  text-decoration: none;
  color: #fff;
  background-color: #007BFF;
  padding: 10px 20px;
  border-radius: 5px;
  transition: background-color 0.3s ease;
}

main a:hover {
  background-color: #0056b3;
}

/* Form container */
main > div:nth-child(2) {
  background-color: #fff;
  max-width: 400px;
  margin: 0 auto;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* Label and Input styling */
label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

input[type="text"] {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

/* Footer styling */
footer {
  margin-top: 40px;
  background-color: #333;
  color: #fff;
  text-align: center;
  padding: 15px 0;
  position: fixed;
  width: 100%;
  bottom: 0;
}

    </style>
  </head>
  <body>
    
    <main>
      <div>
        <a href="home.html">home</a>
        <a href="login.html">login</a>
        <a href="cart.html">cart</a>
        <a href="booking.html">booking</a>
      </div>
      <div>
        <label for="username">username</label>
        <input type="text"id="username"placeholder="enter your name">
        <div>
          <div>
            <label for="emailid">emailid</label>
            <input type="text"id="emailid"placeholder="enter your emailid">
          </div>
          <div>        
            <label for="password">password</label>
            <input type="text"id="password"placeholder="enter your password"></div>
    </main>
    <footer>
      <p>&copy; 2025 My Website. All rights reserved.</p>
    </footer>
  </body>
</html>
