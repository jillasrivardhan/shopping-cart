<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shopify-buy what you like</title>
    
    <style>
      /* Reset default browser styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Body styling */
body {
  background-image: url('image3.jpg');
  font-family: Arial, sans-serif;
  line-height: 1.6;
  background-color: #ece2e2;
  color: #333;
}

/* Header styling */
header {
  background-color: #333;
  color: #ebe8e8;
  padding: 20px 0;
  text-align: center;
}

header h1 {
  font-size: 2em;
}

/* Navigation links */
main div {
  display: flex;
  justify-content: center;
  gap: 20px;
  background-color: #fff;
  padding: 15px;
  margin: 20px auto;
  width: fit-content;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

main a {
  text-decoration: none;
  color: #333;
  font-weight: bold;
  padding: 10px 15px;
  border-radius: 5px;
  transition: background-color 0.3s ease;
}

main a:hover {
  background-color: #333;
  color: #fff;
}

/* Footer styling */
footer {
  background-color: #333;
  color: #fff;
  text-align: center;
  padding: 15px 0;
  position: fixed;
  bottom: 0;
  width: 100%;
}

    </style>
  </head>
  <body>
    <header>
      <h1>welcome to my store</h1>
    </header>
    <main>
      <div>
        <a href="home.html">home</a>
        <a href="login.html">login</a>

      </div>
    </main>
    <footer>

    </footer>
  </body>
</html>
